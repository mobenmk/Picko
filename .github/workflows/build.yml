name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Icon and settings
        run: |
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp static/icon-192.png $R/mipmap-$d/ic_launcher.png
            cp static/icon-192.png $R/mipmap-$d/ic_launcher_round.png
            rm -f $R/mipmap-$d/ic_launcher_foreground.png
          done
          M=android/app/src/main/AndroidManifest.xml
          grep -q usesCleartextTraffic $M || sed -i 's/<application/<application android:usesCleartextTraffic="true"/' $M
      - name: Build
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Picko ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
